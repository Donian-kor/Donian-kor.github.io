<!DOCTYPE html>
<html lang="ko">

    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'Pretendard', 'monospace'] },
          colors: { accent: '#2563EB' },

  <style>
    body { font-family: 'JetBrains Mono', 'Pretendard', monospace; background: #0a0a0a; }
    .keep-all { word-break: keep-all; overflow-wrap: break-word; }
    .board-row { transition: background-color 0.15s, border-color 0.15s; }
    .board-row:hover { background-color: rgba(255,255,255,0.03); border-color: rgba(34,197,94,0.35); }
    .modal-backdrop { background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
    .lock-icon { width: 14px; height: 14px; flex-shrink: 0; }
    /* 관리자 Donian 뱃지 애니메이션 (메인 DONIAN 라벨 효과 축소) */
    @keyframes donianBadgeGlow {
      0%, 100% { text-shadow: 0 0 6px rgba(52, 211, 153, 0.45); }
      50% { text-shadow: 0 0 14px rgba(52, 211, 153, 0.85); }
    }
    .donian-badge {
      animation: donianBadgeGlow 2.4s ease-in-out infinite;
      transition: text-shadow 0.15s ease, transform 0.15s ease;
      display: inline-block;
    }
    @media (prefers-reduced-motion: reduce) {
      .donian-badge { animation: none; text-shadow: 0 0 6px rgba(52, 211, 153, 0.45); }
    }
    .pw-mask { -webkit-text-security: disc; text-security: disc; }
    /* 입력창 내부 하이라이팅 (투명 텍스트 + 하이라이트 레이어) */
    .hl-wrap { position: relative; }
    .hl-layer { pointer-events: none; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; }
    .hl-layer-single { white-space: pre; overflow: hidden; }
    .hl-input { color: transparent; -webkit-text-fill-color: transparent; caret-color: #e4e4e7; overflow-wrap: break-word; word-break: normal; }
    .hl-input::placeholder { color: #71717a; -webkit-text-fill-color: #71717a; }
    .hl-input::selection { background: rgba(59,130,246,0.35); }
    /* Matrix 배경 (메인화면과 동일 효과) */
    #matrix-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.42; }
    @media (max-width: 640px) { #matrix-bg { opacity: 0.25; } }
  </style>
</head>
<body class="bg-[#0a0a0a] text-zinc-200 antialiased min-h-screen">

        <a id="sponsor-kakao" href="https://qr.kakaopay.com/FL8dh56ra" target="_blank" rel="noopener" aria-label="kakao 후원" title="kakao 후원" class="inline-flex sm:hidden items-center gap-1 px-1 py-1 text-emerald-400 hover:text-emerald-300 transition whitespace-nowrap"><iconify-icon icon="solar:heart-bold" aria-hidden="true" class="text-sm"></iconify-icon>kakao후원</a>

    // 폴드 펼침·태블릿처럼 화면이 넓은 터치 기기에서는 카카오페이 후원 링크도 함께 표시
    (function () {
      function updateSponsorLinks() {
        var coarse = window.matchMedia('(pointer: coarse)').matches; // 주 입력 수단이 손가락(터치)
        var wide = window.matchMedia('(min-width: 640px)').matches;  // 화면 너비 640px 이상
        var kakao = document.getElementById('sponsor-kakao');
        if (kakao) kakao.style.display = (coarse && wide) ? 'inline-flex' : '';
      }
      window.updateSponsorLinks = updateSponsorLinks;

    })();

  <script>
    // ---------- 설정 ----------
    const API_BASE = 'https://board-api.donian.workers.dev';
    const PAGE_SIZE = 10;
    // Cloudflare Turnstile Site Key
    const TURNSTILE_SITE_KEY = '0x4AAAAAAGEuj5z4bjUhFlrp';

    // -webkit-text-security 미지원 브라우저(Firefox 등)는 type=password로 폴백
    const supportsTextSecurity = CSS.supports('-webkit-text-security', 'disc');
    function applyPwFallback() {
      if (!supportsTextSecurity) {
        document.querySelectorAll('.pw-mask').forEach((el) => { el.type = 'password'; });
      }
    }
    applyPwFallback();

    // ---------- Turnstile 위젯 ----------
    const turnstileWidgets = new Map();
    function setupTurnstile() {
      if (!TURNSTILE_SITE_KEY || TURNSTILE_SITE_KEY.indexOf('YOUR') !== -1) return;
      const render = () => {
        if (typeof turnstile === 'undefined') return;
        document.querySelectorAll('.cf-turnstile').forEach((el) => {
          if (el.dataset.rendered) return;
          if (el.offsetParent === null) return; // 숨겨진 컨테이너는 건너뜀
          try {
            const id = turnstile.render(el, { sitekey: TURNSTILE_SITE_KEY, theme: 'dark' });
            el.dataset.rendered = '1';
            turnstileWidgets.set(el, id);
          } catch (e) {}
        });
      };
      if (typeof turnstile !== 'undefined') { render(); return; }
      const script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
      script.async = true;
      script.onload = render;
      document.head.appendChild(script);
    }
    function resetTurnstile() {
      if (typeof turnstile === 'undefined') return;
      turnstileWidgets.forEach((id) => {
        try { turnstile.reset(id); } catch (e) {}
      });
    }
    // ---------- 상태 ----------
    let currentPage = 1;
    let totalPages = 1;
    let currentSearch = '';
    let currentPostId = null;

    // ---------- 유틸 ----------
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function renderName(name, isAdmin) {
      if (isAdmin) return '<span class="donian-badge px-1.5 py-0.5 rounded text-[0.75rem] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 align-middle">Donian</span>';
      return escapeHtml(name || '익명');
    }
    // 중첩 댓글 트리 렌더링
    function renderCommentTree(comments) {
      const ids = new Set(comments.map((c) => c.id));
      const childrenMap = {};
      const roots = [];
      for (const c of comments) {
        if (c.parent_id && ids.has(c.parent_id)) {
          (childrenMap[c.parent_id] = childrenMap[c.parent_id] || []).push(c);
        } else {
          roots.push(c);
        }
      }
      function node(c, depth) {
        const children = childrenMap[c.id] || [];
        const indent = depth > 0 ? 'ml-4 sm:ml-6 border-l-2 border-l-emerald-500/20' : '';
        return `
          <div class="comment-node" data-cid="${c.id}">
            <div class="rounded-lg border border-white/10 bg-zinc-800/50 p-3 ${indent}">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="text-zinc-100 font-semibold text-xs">${renderName(c.name, c.is_admin)}${!c.is_admin && c.is_author ? '<span class="ml-1 px-1.5 py-0.5 rounded text-[0.6rem] font-bold bg-blue-500/20 text-blue-300 border border-blue-500/40 align-middle">작성자</span>' : ''} <span class="text-zinc-600">· ${fmtPostDate(c.created_at)}</span></span>
                <div class="flex items-center gap-2 shrink-0">

                </div>

            </div>
            ${children.length ? '<div class="mt-2 space-y-2">' + children.map((ch) => node(ch, depth + 1)).join('') + '</div>' : ''}
          </div>
        `;
      }
      return roots.map((r) => node(r, 0)).join('');
    }
    function fmtDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '-';
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '.' + m + '.' + day;
    }
    // 게시글 작성일: 오늘이면 KST 시간(HH:MM), 아니면 날짜(YYYY.MM.DD)
    function fmtPostDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '-';
      const kst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
      const now = new Date(Date.now() + 9 * 60 * 60 * 1000);
      const y = kst.getUTCFullYear();
      const m = String(kst.getUTCMonth() + 1).padStart(2, '0');
      const day = String(kst.getUTCDate()).padStart(2, '0');
      const todayY = now.getUTCFullYear();
      const todayM = String(now.getUTCMonth() + 1).padStart(2, '0');
      const todayD = String(now.getUTCDate()).padStart(2, '0');
      if (y === todayY && m === todayM && day === todayD) {
        const hh = String(kst.getUTCHours()).padStart(2, '0');
        const mm = String(kst.getUTCMinutes()).padStart(2, '0');
        return '<span class="text-zinc-300">' + hh + ':' + mm + '</span>';
      }
      return y + '.' + m + '.' + day;
    }
    function nl2br(s) {
      return escapeHtml(s).replace(/\n/g, '<br>');
    }
    async function api(path, options) {
      const opts = { ...(options || {}) };
      // 관리자 모드면 POST/PUT/DELETE 요청에 token 자동 첨부
      if (opts.body && typeof opts.body === 'string' && opts.method && opts.method !== 'GET') {
        try {
          const bodyObj = JSON.parse(opts.body);
          const token = sessionStorage.getItem('board_admin_token');
          if (token && bodyObj.token === undefined) bodyObj.token = token;
          opts.body = JSON.stringify(bodyObj);
        } catch (e) {}
      }
      const res = await fetch(API_BASE + path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || ('HTTP ' + res.status));
        err.data = data;
        throw err;
      }
      return data;
    }
    function showToast(msg) {

    // 입력창에 브라우저 기본 팝업 스타일로 경고 표시
    function setFieldError(input, msg) {

    // ---------- 글자 수 제한 (한글 기준 코드포인트) ----------
    function charLen(s) { return [...String(s)].length; }
    function truncateChars(s, max) {
      const a = [...String(s)];
      return a.length > max ? a.slice(0, max).join('') : String(s);
    }
    // 관리자 글쓰기용 랜덤 비밀번호 생성 (기본 20자)
    function genRandomPassword(len = 20) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      let s = '';
      for (let i = 0; i < len; i++) s += chars[arr[i] % chars.length];
      return s;
    }
    const KOREAN_CHAR_RE = /[ㄱ-ㅎㅏ-ㅣ가-힣]/u;

    // ---------- 작성자 이름 사칭 방지 ----------
    const IMPERSONATION_NAMES = [
      '관리자','운영자','사이트관리자','사이트관리','운영매니저','매니저','총감독','감독자',
      '관리','운영','운영진','운영팀','관리팀','관리자님','운영자님','슈퍼관리자','최고관리자',
      '총관리자','수석관리자','웹마스터','마스터','관리원','감독','감독관','총감독관','매니저님',
      '사이트운영자','시스템관리자','관리계정','운영계정','공식',
      'admin','administrator','gm','siteadmin','superadmin','manager','operator','moderator',
      'mod','owner','webmaster','root','system','staff','support','supervisor','director',
      'generalmanager','sitemanager','operationsmanager','adminteam','official','sysadmin',
      'sysop','superuser','siteowner','siteoperator','headadmin','headmod','leadmod','gamemaster',
      'donian','monian','nonian','ponian','donnian','dunian','bonian','conian','gonian','honian',
      'jonian','lonian','ronian','sonian','tonian','vonian','wonian','xonian','yonian','zonian',
      'doonian','doniian','doniaan','doniann','donia','dnian','doian','donien','doniun','donaian',
      '도니안'
    ];
    const IMPERSONATION_SET = new Set(IMPERSONATION_NAMES.map((w) => String(w).toLowerCase().replace(/[\s\p{P}\p{S}_]+/gu, '')).filter(Boolean));
    function isImpersonationName(name) {
      const n = String(name).toLowerCase().replace(/[\s\p{P}\p{S}_]+/gu, '');
      if (!n) return false;
      for (const w of IMPERSONATION_SET) {
        if ([...w].length >= 2 && n.includes(w)) return true;
      }
      return false;
    }
    // 사칭 단어가 이름의 어떤 위치에 있는지 (하이라이트용)
    function findImpersonationRanges(name) {
      const { norm, map } = normalizeWithMap(String(name));
      if (!norm) return [];
      const ranges = [];
      for (const w of IMPERSONATION_SET) {
        const wl = [...w].length;
        if (wl < 2) continue;
        let from = 0;
        while (from <= norm.length - wl) {
          const idx = norm.indexOf(w, from);
          if (idx === -1) break;
          ranges.push([map[idx], map[idx + wl - 1] + 1]);
          from = idx + 1;
        }
      }
      if (!ranges.length) return [];
      ranges.sort((a, b) => a[0] - b[0]);
      const merged = [];
      for (const r of ranges) {
        if (merged.length && r[0] <= merged[merged.length - 1][1]) {
          merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], r[1]);
        } else merged.push([r[0], r[1]]);
      }
      return merged;
    }
    // 사칭 하이라이트 HTML (제목/내용의 renderHighlighted와 동일한 mark 스타일)
    function renderImpersonationHighlight(text) {
      const ranges = findImpersonationRanges(text);
      if (!ranges.length) return escapeHtml(text);
      let html = '';
      let pos = 0;
      for (const [start, end] of ranges) {
        html += escapeHtml(text.slice(pos, start));
        html += `<mark style="background:rgba(239,68,68,0.45);color:#fecaca;border-radius:2px;">${escapeHtml(text.slice(start, end))}</mark>`;
        pos = end;
      }
      html += escapeHtml(text.slice(pos));
      return html;
    }
    // 이름 입력 필드: 사칭+욕설 하이라이트 + 입력 즉시 폼 제출 차단
    const FILTER_MSG = '사칭,욕설,비속어는 차단됩니다';
    function applyImpersonationHighlight(el, highlightEl, msgEl) {
      if (!el) return;
      const val = el.value;
      const impRanges = findImpersonationRanges(val);
      let badRanges = impRanges.slice();
      // 욕설/비속어도 이름에서 차단 (PROFANITY_SET 로드됐을 때)
      let profanityHit = false;
      try {
        const pfRanges = findProfanityRanges(val);
        profanityHit = pfRanges.length > 0;
        badRanges = badRanges.concat(pfRanges);
      } catch (e) {}
      // 하이라이트 레이어: 사칭(진한 빨강) + 욕설(빨강) 모두 표시
      if (highlightEl) {
        badRanges.sort((a, b) => a[0] - b[0]);
        const merged = [];
        for (const r of badRanges) {
          if (merged.length && r[0] <= merged[merged.length - 1][1]) {
            merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], r[1]);
          } else merged.push([r[0], r[1]]);
        }
        let html = '';
        let pos = 0;
        for (const [s, e] of merged) {
          html += escapeHtml(val.slice(pos, s));
          html += `<mark style="background:rgba(239,68,68,0.45);color:#fecaca;border-radius:2px;">${escapeHtml(val.slice(s, e))}</mark>`;
          pos = e;
        }
        html += escapeHtml(val.slice(pos));
        highlightEl.innerHTML = html;
      }
      const blocked = impRanges.length > 0 || profanityHit;
      if (blocked) {
        el.style.borderColor = 'rgba(239,68,68,0.8)';
        el.style.backgroundColor = 'rgba(239,68,68,0.12)';
        el.title = FILTER_MSG;
        el.setCustomValidity(FILTER_MSG);
      } else {
        el.style.borderColor = '';
        el.style.backgroundColor = '';
        el.title = '';
        el.setCustomValidity('');
      }
      if (msgEl) {
        msgEl.classList.toggle('hidden', !blocked);
        msgEl.textContent = FILTER_MSG;
      }
    }

    // ---------- 욕설/비속어 하이라이팅 ----------
    const PROFANITY_CACHE_KEY = 'board_profanity_v1';
    let PROFANITY_SET = null;
    let PROFANITY_MAXLEN = 0;

    function setProfanityWords(words) {
      const norm = words.map((w) => String(w).toLowerCase().replace(/[\s\p{P}\p{S}_]+/gu, '')).filter(Boolean);
      PROFANITY_SET = new Set(norm);
      PROFANITY_MAXLEN = norm.reduce((m, w) => Math.max(m, [...w].length), 0);
      // 욕설 목록 로드 완료 후, 이미 입력된 이름 필드 재검사
      try {
        const wn = document.querySelector('#write-form [name="name"]');
        if (wn) applyImpersonationHighlight(wn, document.getElementById('write-name-highlight'), document.getElementById('write-name-filter-msg'));
        const cn = document.querySelector('#comment-form [name="name"]');
        if (cn) applyImpersonationHighlight(cn, document.getElementById('comment-name-highlight'));
      } catch (e) {}
    }

    async function loadProfanity() {
      if (PROFANITY_SET) return;
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(PROFANITY_CACHE_KEY) || 'null'); } catch (e) {}
      if (cached && Array.isArray(cached.words) && cached.words.length) {
        setProfanityWords(cached.words);
        return;
      }
      try {
        const data = await api('/profanity-list');
        const words = data.words || [];
        setProfanityWords(words);
        try { localStorage.setItem(PROFANITY_CACHE_KEY, JSON.stringify({ words })); } catch (e) {}
      } catch (e) { PROFANITY_SET = new Set(); }
    }

    // 정규화하면서 원본 인덱스 매핑
    function normalizeWithMap(text) {
      let norm = '';
      const map = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (/[\s\p{P}\p{S}_]/u.test(ch)) continue;
        norm += ch.toLowerCase();
        map.push(i);
      }
      return { norm, map };
    }

    function findProfanityRanges(text) {
      if (!PROFANITY_SET || !PROFANITY_SET.size) return [];
      const { norm, map } = normalizeWithMap(text);
      const ranges = [];
      const maxLen = Math.min(PROFANITY_MAXLEN, norm.length);
      for (let i = 0; i < norm.length; i++) {
        for (let len = maxLen; len >= 2; len--) {
          if (i + len > norm.length) continue;
          if (PROFANITY_SET.has(norm.slice(i, i + len))) {
            ranges.push([map[i], map[i + len - 1] + 1]);
            i += len - 1;
            break;
          }
        }
      }
      ranges.sort((a, b) => a[0] - b[0]);
      const merged = [];
      for (const r of ranges) {
        if (merged.length && r[0] <= merged[merged.length - 1][1]) {
          merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], r[1]);
        } else {
          merged.push([r[0], r[1]]);
        }
      }
      return merged;
    }

    function renderHighlighted(text, useBr = true) {
      const esc = useBr ? nl2br : escapeHtml;
      const ranges = findProfanityRanges(text);
      if (!ranges.length) return { html: esc(text), count: 0 };
      let html = '';
      let pos = 0;
      for (const [start, end] of ranges) {
        html += esc(text.slice(pos, start));
        html += `<mark style="background:rgba(239,68,68,0.32);color:#fecaca;border-radius:2px;">${escapeHtml(text.slice(start, end))}</mark>`;
        pos = end;
      }
      html += esc(text.slice(pos));
      return { html, count: ranges.length };
    }

    // ---------- 목록 ----------
    const listEl = document.getElementById('board-list');

    // 목록 캐시 (localStorage, stale-while-revalidate)
    const LIST_CACHE_PREFIX = 'board_list_v1:';
    function listCacheKey() {
      const typeEl = document.getElementById('search-type');
      const type = currentSearch ? (typeEl ? typeEl.value : 'both') : '';

    async function loadList(forceFresh) {
      const key = listCacheKey();
      let cacheHit = false;
      // 1) 저장된 목록이 있으면 즉시 표시 (네트워크 대기 0ms)
      try {
        const cached = JSON.parse(localStorage.getItem(key) || 'null');
        if (cached && Array.isArray(cached.posts)) {
          renderListData(cached);
          cacheHit = true;
        }
      } catch (e) {}
      if (!cacheHit) {
        listEl.innerHTML = '<div class="px-4 py-8 text-center text-zinc-500 text-sm">Loading...</div>';
        emptyEl.classList.add('hidden');
      }
      // 2) 항상 최신 데이터로 백그라운드 갱신 (새 글/답변 반영)
      try {
        const params = new URLSearchParams({ page: currentPage });
        if (currentSearch) {
          params.set('search', currentSearch);
          const typeEl = document.getElementById('search-type');
          if (typeEl) params.set('search_type', typeEl.value);
        }
        let reqPath = '/posts?' + params.toString();
        // 강제 새로고침: 캐시를 확실히 우회하도록 고유 파라미터 추가
        if (forceFresh) reqPath += '&_=' + Date.now();
        const data = await api(reqPath);
        renderListData(data);
        try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
      } catch (err) {
        // 캐시가 있으면 기존 화면 유지, 없을 때만 오류 표시
        if (!cacheHit) {
          listEl.innerHTML = `<div class="px-4 py-8 text-center text-rose-400 text-sm">불러오기 실패: ${escapeHtml(err.message)}</div>`;
        }

    }

    function renderPagination() {
      if (totalPages <= 1) { paginationEl.innerHTML = ''; return; }
      let html = '';
      const prev = Math.max(1, currentPage - 1);
      const next = Math.min(totalPages, currentPage + 1);
      html += `<button data-page="${prev}" class="px-3 py-1.5 rounded bg-zinc-800 border border-white/10 text-zinc-300 text-xs hover:bg-zinc-700 transition ${currentPage === 1 ? 'opacity-40 pointer-events-none' : ''}">이전</button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
          html += `<button data-page="${i}" class="px-3 py-1.5 rounded text-xs transition ${i === currentPage ? 'bg-green-500/20 text-green-300 border border-green-500/40' : 'bg-zinc-800 border border-white/10 text-zinc-300 hover:bg-zinc-700'}">${i}</button>`;
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          html += '<span class="text-zinc-600 text-xs px-1">…</span>';
        }
      }
      html += `<button data-page="${next}" class="px-3 py-1.5 rounded bg-zinc-800 border border-white/10 text-zinc-300 text-xs hover:bg-zinc-700 transition ${currentPage === totalPages ? 'opacity-40 pointer-events-none' : ''}">다음</button>`;
      paginationEl.innerHTML = html;
      paginationEl.querySelectorAll('button[data-page]').forEach((btn) => {
        btn.addEventListener('click', () => {

        });

    // 글자 수 제한 적용

      const nameEl = writeForm.querySelector('[name="name"]');

      const titleEl = writeForm.querySelector('[name="title"]');
      const contentEl = writeForm.querySelector('[name="content"]');

        if (counter) counter.textContent = charLen(contentEl.value) + ' / 500';

      });
      titleEl.addEventListener('input', () => {
        const t = truncateChars(titleEl.value, 20);
        if (t !== titleEl.value) titleEl.value = t;
      });
      contentEl.addEventListener('input', () => {
        const t = truncateChars(contentEl.value, 500);
        if (t !== contentEl.value) contentEl.value = t;
        updateCounter();
      });
      updateCounter();
    })();
    writeForm.querySelector('[name="title"]').addEventListener('scroll', (e) => {

    writeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      writeError.classList.add('hidden');
      updateWritePreview();
      const titleEl = writeForm.querySelector('[name="title"]');
      const contentEl = writeForm.querySelector('[name="content"]');
      const pwEl = writeForm.querySelector('[name="pw"]');
      const nameEl = writeForm.querySelector('[name="name"]');
      clearFieldErrors(titleEl, contentEl, pwEl, nameEl);

      const contentVal = contentEl.value;

      if (!isAdminMode() && findProfanityRanges(nameVal).length > 0) { setFieldError(nameEl, '이름에 욕설/비속어가 포함되어 사용할 수 없습니다.'); return; }

        writeError.textContent = '욕설/비속어가 포함되어 있습니다. 입력창에 빨간색으로 표시된 부분을 수정한 후 다시 등록하세요.';

    async function deletePost(id) {
      let body;
      if (isAdminMode()) {
        if (!(await adminKeepAlive())) return; // 세션 만료 시 재로그인 안내
        body = {}; // 관리자 토큰 자동 첨부 (api)
      } else {
        const pw = prompt('글 삭제 비밀번호를 입력하세요.');
        if (pw === null) return;
        body = { password: pw };
      }
      try {
        await api('/posts/' + id, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        closeModal('detail-modal');
        clearListCache();
        loadList(true);
        showToast('글이 삭제되었습니다.');
      } catch (err) {
        showToast('삭제 실패: ' + err.message);
      }
    }

    function openEdit(p) {

      const form = document.getElementById('edit-form');
      form.reset();
      document.getElementById('edit-error').classList.add('hidden');

        pwEl.placeholder = '관리자 (자동 생성)';

        pwEl.placeholder = '비밀번호';
        pwEl.style.color = '';

      form.querySelector('[name="content"]').value = p.content;

    const editError = document.getElementById('edit-error');

      const t = truncateChars(e.target.value, 20);
      if (t !== e.target.value) e.target.value = t;
    });
    editForm.querySelector('[name="content"]').addEventListener('input', (e) => {
      const t = truncateChars(e.target.value, 500);
      if (t !== e.target.value) e.target.value = t;

    editForm.querySelector('[name="pw"]').addEventListener('input', (e) => {
      let v = [...e.target.value].filter((ch) => !KOREAN_CHAR_RE.test(ch)).join('');

      if (v !== e.target.value) e.target.value = v;

    async function submitComment(e, postId) {
      e.preventDefault();
      const form = e.target;
      const contentEl = form.querySelector('[name="content"]');
      const pwEl = form.querySelector('[name="pw"]');
      const nameEl = form.querySelector('[name="name"]');
      clearFieldErrors(contentEl, pwEl, nameEl);
      const contentVal = contentEl.value;
      if (!contentVal.trim()) { setFieldError(contentEl, '댓글 내용을 입력하세요.'); return; }
      const pwVal = pwEl.value;
      if (pwVal.length < 2) {
        setFieldError(pwEl, pwVal.length === 0 ? '비밀번호를 입력하세요.' : '비밀번호는 2글자 이상이어야 합니다.');
        return;
      }
      const nameVal = nameEl.value.trim();
      const nameMsg = document.getElementById('write-name-filter-msg');
      if (!nameVal) {
        if (nameMsg) { nameMsg.textContent = '이름을 입력하세요.'; nameMsg.classList.remove('hidden'); }
        setFieldError(nameEl, '이름을 입력하세요.');
        return;
      }
      if (nameVal.length === 1) { setFieldError(nameEl, '이름은 2글자 이상이어야 합니다.'); return; }
      if (!isAdminMode() && (isImpersonationName(nameVal) || findProfanityRanges(nameVal).length > 0)) {
        if (nameMsg) { nameMsg.textContent = FILTER_MSG; nameMsg.classList.remove('hidden'); }
        setFieldError(nameEl, FILTER_MSG);
        return;
      }
      if (nameMsg) nameMsg.classList.add('hidden');
      const ranges = findProfanityRanges(contentVal);
      if (ranges.length > 0) {
        showToast('욕설/비속어를 수정한 후 다시 등록하세요.');
        return;
      }
      const fd = new FormData(form);
      const body = {
        name: fd.get('name') || '',
        password: fd.get('pw') || '',
        content: fd.get('content') || '',
        botcheck: fd.get('botcheck') || '',
        'cf-turnstile-response': fd.get('cf-turnstile-response') || '',
      };
      try {
        await api('/posts/' + postId + '/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        openDetail(postId);
        clearListCache();
        showToast('댓글이 등록되었습니다.');
      } catch (err) {
        showToast('댓글 등록 실패: ' + err.message);
      }
    }

        showToast('댓글이 삭제되었습니다.');
      } catch (err) {
        showToast('삭제 실패: ' + err.message);
      }
    }

          </div>
          <textarea name="content" required rows="2" maxlength="50" placeholder="답글 (최대 50글자)" class="w-full px-2 py-1 rounded bg-zinc-800 border border-white/10 text-zinc-200 text-xs focus:outline-none focus:border-green-500/50 resize-y"></textarea>
          <div class="cf-turnstile"></div>
          <div class="flex justify-end gap-1">
            <button type="button" class="cancel-reply px-2 py-1 rounded bg-zinc-700 text-zinc-300 text-[0.65rem]">취소</button>
            <button type="submit" class="px-2 py-1 rounded bg-green-500/20 border border-green-500/40 text-green-300 text-[0.65rem]">답글 등록</button>
          </div>
        </form>
      `;
      node.appendChild(wrap);
      const formEl = wrap.querySelector('form');
      const textarea = wrap.querySelector('textarea');
      const replyNameEl = formEl.querySelector('[name="name"]');
      const replyNameHl = wrap.querySelector('.reply-name-highlight');
      if (replyNameEl) replyNameEl.addEventListener('input', (e) => applyImpersonationHighlight(e.target, replyNameHl));
      applyPwFallback();
      setupTurnstile();
      textarea.focus();
      wrap.querySelector('.cancel-reply').addEventListener('click', () => wrap.remove());
      formEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(formEl);
        const replyName = (fd.get('name') || '').trim();
        if (!replyName) { showToast('이름을 입력하세요.'); return; }
        if (!isAdminMode() && isImpersonationName(replyName)) {
          showToast('관리자·운영자 또는 이와 혼동되는 이름은 사용할 수 없습니다.');
          return;
        }
        if (!isAdminMode() && findProfanityRanges(replyName).length > 0) {
          showToast('이름에 욕설/비속어가 포함되어 사용할 수 없습니다.');
          return;
        }
        try {
          await api('/posts/' + currentPostId + '/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: fd.get('name') || '',
              password: fd.get('pw') || '',
              content: fd.get('content') || '',
              parent_id: commentId,
              'cf-turnstile-response': fd.get('cf-turnstile-response') || '',
            }),
          });
          openDetail(currentPostId);
          clearListCache();
          showToast('답글이 등록되었습니다.');
        } catch (err) {
          resetTurnstile();
          showToast('답글 등록 실패: ' + err.message);
        }
      });
    }

    // ---------- Donian 뱃지 스크램블 애니메이션 (메인 DONIAN 라벨 효과 축소) ----------
    let donianAnimStarted = false;
    function startDonianBadgeAnim() {
      if (donianAnimStarted) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      donianAnimStarted = true;
      const FINAL = 'Donian';
      const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      const SCRAMBLE = 900;
      const HOLD = 2200;
      const LOOP = SCRAMBLE + HOLD + 260;
      let start = null;
      function rnd() { return GLYPHS[(Math.random() * GLYPHS.length) | 0]; }
      setInterval(() => {
        const now = performance.now();
        if (start === null) start = now;
        const t = (now - start) % LOOP;
        let text = FINAL;
        if (t < SCRAMBLE) {
          const p = t / SCRAMBLE;
          const settled = Math.min(FINAL.length, Math.floor(p * (FINAL.length + 1)));
          text = '';
          for (let i = 0; i < FINAL.length; i++) text += (i < settled) ? FINAL[i] : rnd();
        }
        document.querySelectorAll('.donian-badge').forEach((el) => {
          if (el.textContent !== text) el.textContent = text;
        });
      }, 50);
    }

    // ---------- 관리자 모드 (토큰 방식, 레이트리밋 면제) ----------
    const adminBtn = document.getElementById('admin-btn');

    function isAdminMode() {
      return !!sessionStorage.getItem('board_admin_token');
    }

    // 관리자 모드: 글쓰기 비밀번호를 20자 랜덤으로 자동 생성(읽기전용)
    function applyAdminWritePassword() {
      const pwEl = writeForm.querySelector('[name="pw"]');
      if (!pwEl) return;
      if (isAdminMode()) {
        if (!pwEl.value || !pwEl.readOnly) pwEl.value = genRandomPassword(20);
        pwEl.readOnly = true;
        pwEl.placeholder = '관리자 (자동 생성)';
        pwEl.style.color = '#6ee7b7';
      } else {
        if (pwEl.readOnly) { pwEl.value = ''; pwEl.readOnly = false; }
        pwEl.placeholder = '최대 8글자 (한글 불가)';
        pwEl.style.color = '';
      }
    }

    function applyAdminName() {
      const on = isAdminMode();
      const nameEl = writeForm.querySelector('[name="name"]');
      if (nameEl) {
        if (on) {
          nameEl.value = 'Donian';
          nameEl.style.color = '#6ee7b7';
          nameEl.classList.add('font-semibold');
        } else {
          if (nameEl.value === 'Donian') nameEl.value = '';
          nameEl.style.color = '';
          nameEl.classList.remove('font-semibold');
        }
      }
      const cnameEl = document.querySelector('#comment-form [name="name"]');
      if (cnameEl) {
        if (on) {
          cnameEl.value = 'Donian';
          cnameEl.style.color = '#6ee7b7';
          cnameEl.classList.add('font-semibold');
        } else {
          if (cnameEl.value === 'Donian') cnameEl.value = '';
          cnameEl.style.color = '';
          cnameEl.classList.remove('font-semibold');
        }
      }
      applyImpersonationHighlight(nameEl, document.getElementById('write-name-highlight'), document.getElementById('write-name-filter-msg'));
      applyImpersonationHighlight(cnameEl, document.getElementById('comment-name-highlight'));
    }

    // 관리자 세션 keepalive (활동 중 토큰 1시간 만료 방지) + 만료 UX
    let adminKeepAliveTimer = null;
    function startAdminKeepAlive() {
      if (adminKeepAliveTimer) return;
      adminKeepAliveTimer = setInterval(() => { adminKeepAlive(); }, 25 * 60 * 1000); // 25분마다 갱신
    }
    function stopAdminKeepAlive() {
      if (adminKeepAliveTimer) { clearInterval(adminKeepAliveTimer); adminKeepAliveTimer = null; }
    }
    function handleAdminExpiry() {
      sessionStorage.removeItem('board_admin_token');
      stopAdminKeepAlive();
      updateAdminBtn();
      showToast('관리자 세션이 만료되었습니다. 관리자 버튼으로 다시 로그인하세요.');
    }
    async function adminKeepAlive() {
      if (!isAdminMode()) return true;
      try {
        const data = await api('/admin/keepalive', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
        if (data.ok) return true;
      } catch (e) {}
      handleAdminExpiry();
      return false;
    }

    function updateAdminBtn() {
      if (!adminBtn) return;
      const on = isAdminMode();
      adminBtn.textContent = on ? '관리자 ✓' : '관리자';
      adminBtn.classList.toggle('text-emerald-300', on);
      adminBtn.classList.toggle('text-zinc-400', !on);
      applyAdminName();
      applyAdminWritePassword();
      if (on) startAdminKeepAlive(); else stopAdminKeepAlive();
    }

    if (adminBtn) {
      adminBtn.addEventListener('click', async () => {
        if (isAdminMode()) {
          sessionStorage.removeItem('board_admin_token');
          updateAdminBtn();
          showToast('관리자 모드가 해제되었습니다.');
          return;
        }
        const pw = prompt('관리자 비밀번호를 입력하세요.');
        if (pw === null) return;
        try {
          const res = await fetch(API_BASE + '/admin/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw }),
          });
          const data = await res.json().catch(() => ({}));
          if (data.ok && data.token) {
            sessionStorage.setItem('board_admin_token', data.token);
            updateAdminBtn();
            showToast('관리자 모드 활성화 — 레이트리밋이 면제됩니다.');
          } else {
            showToast(data.error || '비밀번호가 일치하지 않습니다.');
          }
        } catch (e) {
          showToast('확인 실패: ' + e.message);
        }
      });
    }
    updateAdminBtn();
    if (isAdminMode()) adminKeepAlive(); // 재접속 시 토큰 유효성 즉시 확인(만료 시 안내)

    // ---------- 시작 ----------
    loadList();
    loadProfanity();
    startDonianBadgeAnim();
  </script>

  <!-- Matrix 배경 (메인화면과 동일 효과) -->
  <script>
    (function () {
      const canvas = document.getElementById('matrix-bg');
      if (!canvas) return;
      const ctx = canvas.getContext('2d', { alpha: false });
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const consonants = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎㄲㄸㅃㅆㅉ';
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
      const digits = '0123456789';
      const IDLE_DELAY = 700;
      // 모바일: 렉 방지를 위해 속도·FPS·글자수·해상도 완화 (데스크톱은 5배 유지)
      const isMobile = window.matchMedia('(max-width: 768px)').matches || ('ontouchstart' in window && window.innerWidth < 1024);
      const DRIFT_PER_SEC = isMobile ? 34 : 130;
      const IDLE_FPS = isMobile ? 18 : 30;
      let items = [];
      let raf = 0;
      let pending = 0;
      let drift = 0;
      let dpr = 1;
      let lastScroll = window.scrollY;
      let lastScrollAt = 0;
      let lastDraw = 0;
      let idleTimer = 0;

      function pick(pool) { return pool[(Math.random() * pool.length) | 0]; }
      function randomGlyph() {
        const r = Math.random();
        if (r < 0.45) return pick(consonants);
        if (r < 0.75) return pick(letters);
        return pick(digits);
      }
      function makeSprite(it) {
        const pad = Math.ceil(it.size * 0.55 + (it.glow ? it.size * 0.5 : 0) + it.blur * 1.5) + 2;
        const w = Math.ceil(it.size + pad * 2);
        const h = w;
        const c = document.createElement('canvas');
        c.width = Math.ceil(w * dpr);
        c.height = Math.ceil(h * dpr);
        const g = c.getContext('2d');
        g.scale(dpr, dpr);
        g.font = it.size + "px 'JetBrains Mono', 'Pretendard', monospace";
        g.textAlign = 'left';
        g.textBaseline = 'top';
        g.fillStyle = it.bright ? 'rgba(190,255,205,1)' : 'rgba(0,255,65,1)';
        if (it.glow) { g.shadowColor = 'rgba(0,255,65,0.9)'; g.shadowBlur = it.size * 0.5; }
        if (it.blur > 0) g.filter = 'blur(' + it.blur.toFixed(1) + 'px)';
        g.fillText(it.char, pad, pad);
        return { canvas: c, w: w, h: h, pad: pad };
      }
      function makeItem(w, h, initial) {
        const size = 11 + Math.random() * 20;
        const it = {
          x: Math.random() * (w - size),
          y: initial ? Math.random() * h : -size - Math.random() * h * 0.45,
          size: size,
          alpha: 0.12 + Math.random() * 0.72,
          blur: Math.random() < 0.24 ? 1 + Math.random() * 6 : 0,
          glow: Math.random() < 0.38,
          bright: Math.random() < 0.12,
          speed: 0.45 + Math.random() * 1.1,
          char: randomGlyph(),
        };
        it.sprite = makeSprite(it);
        return it;
      }
      function layout() {
        // 모바일은 DPR 1로 제한 (실제 DPR 2~3의 픽셀 4~9배 그리기 방지)
        dpr = isMobile ? 1 : Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth, h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = isMobile
          ? Math.min(90, Math.max(50, Math.floor((w * h) / 4200)))  // 모바일은 글자 수 대폭 감소
          : Math.min(2000, Math.max(140, Math.floor((w * h) / 2200)));
        items = [];
        for (let i = 0; i < count; i++) items.push(makeItem(w, h, true));
        render();
      }
      function drawGlyph(it) {
        ctx.globalAlpha = it.alpha;
        ctx.drawImage(it.sprite.canvas, it.x - it.sprite.pad, it.y - it.sprite.pad, it.sprite.w, it.sprite.h);
      }
      function render() {
        const w = window.innerWidth, h = window.innerHeight;
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, w, h);
        for (const it of items) {
          if (it.y < -it.sprite.h || it.y > h + it.sprite.h) continue;
          drawGlyph(it);
        }
        ctx.globalAlpha = 1;
      }
      function drawStatic() { render(); }
      function step(now) {
        raf = 0;
        if (!lastDraw) lastDraw = now;
        const idle = now - lastScrollAt > IDLE_DELAY;
        if (idle && now - lastDraw < 1000 / IDLE_FPS) { raf = requestAnimationFrame(step); return; }
        const dt = Math.min(now - lastDraw, 250);
        lastDraw = now;
        if (idle) drift += DRIFT_PER_SEC * dt / 1000;
        const chunk = Math.min(pending, 120);
        pending -= chunk;
        const auto = Math.min(drift, 120);
        drift -= auto;
        if (chunk > 0 || auto > 0) {
          const w = window.innerWidth, h = window.innerHeight;
          for (const it of items) {
            it.y += (chunk * 0.5 + auto) * it.speed;
            if (it.y > h + it.sprite.h) Object.assign(it, makeItem(w, h, false));
          }
          render();
        }
        if (pending > 0.5 || now - lastScrollAt > IDLE_DELAY) {
          raf = requestAnimationFrame(step);
        } else {
          lastDraw = 0;
          clearTimeout(idleTimer);
          idleTimer = setTimeout(function () {
            idleTimer = 0;
            if (!raf) raf = requestAnimationFrame(step);
          }, Math.max(IDLE_DELAY - (now - lastScrollAt), 0) + 30);
        }
      }
      function onScroll() {
        const y = window.scrollY;
        pending = Math.min(pending + Math.min(Math.abs(y - lastScroll), 220), 900);
        lastScroll = y;
        lastScrollAt = performance.now();
        clearTimeout(idleTimer);
        idleTimer = 0;
        if (!raf) raf = requestAnimationFrame(step);
      }
      layout();
      lastScrollAt = performance.now();
      if (reduceMotion) {
        drawStatic();
      } else {
        window.addEventListener('resize', layout);
        window.addEventListener('scroll', onScroll, { passive: true });
        raf = requestAnimationFrame(step);
      }
    })();
  </script>
