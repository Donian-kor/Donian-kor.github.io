<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donian · 개인 포트폴리오</title>
  <meta name="description" content="Python·Kotlin으로 프로그래밍을 공부하는 Donian의 개인 포트폴리오. 오픈소스 프로젝트를 소개합니다.">
  <meta property="og:title" content="Donian · 개인 포트폴리오">
  <meta property="og:description" content="Python·Kotlin으로 프로그래밍을 공부하는 개발자의 포트폴리오.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://donian-kor.github.io">
  <meta name="twitter:card" content="summary_large_image">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'Pretendard', 'monospace'] },
          colors: { accent: '#2563EB' },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'JetBrains Mono', 'Pretendard', monospace; background: #0a0a0a; }
    .keep-all { word-break: keep-all; }
    html { scroll-behavior: smooth; }
    .noise {
      position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .scanlines {
      position: fixed; inset: 0; z-index: 59; pointer-events: none; opacity: 0.04;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px);
    }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(1rem); } to { opacity:1; transform:translateY(0); } }
    .reveal { opacity:0; transform:translateY(1rem); }
    .reveal.visible { animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes blink { 0%,50% { opacity:1; } 51%,100% { opacity:0; } }
    .cursor-blink { animation: blink 1s step-end infinite; }
    .prompt::before { content: '$ '; color: #22c55e; font-weight: 700; }
    .section-cmd { color: #22c55e; }
    .section-cmd::before { content: '$ '; }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgba(37,99,235,0.25); }
    .project-card { transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), box-shadow 0.3s; position: relative; transform-origin: center center; }
    .project-card:hover { transform: scale(1.5); z-index: 50; box-shadow: 0 24px 60px -12px rgba(0,0,0,0.7); }
    .term-border { border: 1px solid rgba(255,255,255,0.08); }
    ::selection { background: rgba(37,99,235,0.4); }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none !important; opacity:1 !important; transform:none !important; }
      html { scroll-behavior: auto; }
    }
    .lang-badge { font-size: 0.65rem; }
  </style>
</head>
<body class="bg-[#0a0a0a] text-zinc-200 antialiased">
  <div class="noise"></div>
  <div class="scanlines"></div>

  <!-- Terminal window chrome (sticky) -->
  <div class="fixed top-0 left-0 right-0 z-40 bg-zinc-900/90 backdrop-blur border-b border-white/5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-10 flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-red-500"></span>
      <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
      <span class="w-3 h-3 rounded-full bg-green-500"></span>
      <span class="ml-3 text-xs font-mono"><span class="text-white">Donian</span><span class="text-zinc-400 hidden sm:inline"> Portfolio — AI coding session</span></span>
      <div class="ml-auto flex items-center gap-4 text-xs text-zinc-400 font-mono">
        <a href="#about" class="hover:text-zinc-200 transition">about</a>
        <a href="#projects" class="hover:text-zinc-200 transition">projects</a>
        <a href="#stack" class="hover:text-zinc-200 transition">stack</a>
        <a href="https://github.com/Donian-kor" target="_blank" rel="noopener" class="hover:text-zinc-200 transition">github</a>
      </div>
    </div>
  </div>

  <!-- Project modal (모바일 확대 보기) -->
  <div id="project-modal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/80 backdrop-blur p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="relative w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-xl bg-zinc-900 border border-white/10 shadow-2xl">
      <button id="modal-close" class="absolute top-3 right-3 z-10 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-zinc-200 flex items-center justify-center transition" aria-label="닫기">
        <iconify-icon icon="solar:close-circle-bold" class="text-xl"></iconify-icon>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-14 pb-8">

    <!-- Hero / Terminal intro -->
    <section id="top" class="py-6">
      <div class="font-mono text-sm leading-relaxed">
        <div class="text-zinc-400 mb-2"># Donian Portfolio — AI coding session</div>
        <div class="mb-4">
          <span class="text-green-400 font-bold">$</span>
          <span class="text-zinc-200 ml-2">whoami</span>
        </div>
        <div class="mb-4 pl-2">
          <div class="text-blue-400 font-bold text-2xl md:text-4xl keep-all">Donian</div>
          <div class="text-zinc-400 text-sm">개인 포트폴리오 · Python · Kotlin 개발자</div>
        </div>
        <div class="mb-4">
          <span class="text-green-400 font-bold">$</span>
          <span class="text-zinc-200 ml-2">cat intro.txt</span>
        </div>
        <!-- Terminal streaming -->
        <div class="rounded-lg border border-white/10 bg-zinc-900/60 p-4 mb-4">
          <div id="terminal-body" class="text-zinc-300 leading-relaxed space-y-1 min-h-[8rem]"></div>
        </div>
        <div class="flex flex-wrap gap-2 mb-6">
          <a href="https://donian-kor.tistory.com/" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs hover:bg-amber-500/30 transition">
            <iconify-icon icon="solar:document-text-bold"></iconify-icon> blog
          </a>
          <a href="https://www.youtube.com/@songmakernightmusic" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded bg-red-500/20 border border-red-500/40 text-red-300 text-xs hover:bg-red-500/30 transition">
            <iconify-icon icon="solar:play-circle-bold"></iconify-icon> youtube
          </a>
          <a href="mailto:doniankhj@gmail.com" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs hover:bg-rose-500/30 transition">
            <iconify-icon icon="solar:letter-bold"></iconify-icon> gmail
          </a>
        </div>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="py-4 border-t border-white/5">
      <div class="mb-2 font-mono text-sm">
        <span class="text-green-400 font-bold">$</span>
        <span class="text-zinc-200 ml-2">cat about.txt</span>
      </div>
      <div class="rounded-lg bg-zinc-900/60 border border-white/10 font-mono text-sm p-4">
        <div id="about-body" class="pl-2 text-zinc-400 leading-relaxed space-y-1 min-h-[4rem]"></div>
      </div>
    </section>

    <!-- Projects -->
    <section id="projects" class="py-4 border-t border-white/5">
      <div class="font-mono text-sm">
        <div class="mb-3 flex items-center gap-3 flex-wrap">
          <span class="text-green-400 font-bold">$</span>
          <span class="text-zinc-200">ls projects/</span>
          <div id="category-tabs" class="hidden sm:flex flex-wrap gap-1.5 ml-auto" role="tablist"></div>
          <select id="category-select" class="sm:hidden ml-auto px-2 py-1 rounded bg-zinc-800 border border-white/10 text-zinc-300 text-xs font-mono" aria-label="프로젝트 카테고리 선택"></select>
        </div>
        <div id="project-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3" aria-live="polite"></div>
        <div id="empty-state" class="hidden mt-4 text-center text-zinc-400">해당 카테고리에 프로젝트가 없습니다.</div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 border-t border-white/5 font-mono text-xs text-zinc-400">
      <div class="flex items-center justify-between">
        <span>© 2026 Donian. All rights reserved.</span>
        <div class="flex items-center gap-3">
          <a href="https://github.com/Donian-kor" target="_blank" rel="noopener" class="hover:text-zinc-200 transition" aria-label="GitHub">
            <iconify-icon icon="solar:github-bold" class="text-base"></iconify-icon>
          </a>
          <a href="https://donian-kor.tistory.com/" target="_blank" rel="noopener" class="hover:text-zinc-200 transition" aria-label="Blog">
            <iconify-icon icon="solar:document-text-bold" class="text-base"></iconify-icon>
          </a>
          <a href="https://www.youtube.com/@songmakernightmusic" target="_blank" rel="noopener" class="hover:text-zinc-200 transition" aria-label="YouTube">
            <iconify-icon icon="solar:play-circle-bold" class="text-base"></iconify-icon>
          </a>
        </div>
      </div>
    </footer>
  </main>

  <script>
    // ---------- 모바일 메뉴 (터미널 스타일이라 생략) ----------

    // ---------- 프로젝트 렌더링 ----------
    const grid = document.getElementById('project-grid');
    const tabs = document.getElementById('category-tabs');
    const empty = document.getElementById('empty-state');
    let allProjects = [];
    let currentCategory = 'all';

    const langColor = {
      'Kotlin': 'text-purple-300',
      'Python': 'text-yellow-300',
      'JavaScript': 'text-amber-300',
      'HTML': 'text-orange-300',
      'C#': 'text-green-300',
      'Rust': 'text-red-300',
      'TypeScript': 'text-blue-300',
    };
    const langDesc = {
      'Kotlin': 'JetBrains의 JVM 기반 언어, Android 공식 언어',
      'Python': '범용 프로그래밍 언어, 스크립팅·자동화·AI',
      'JavaScript': '웹 브라우저 스크립트 언어',
      'HTML': '웹 페이지 구조 마크업 언어',
      'C#': 'Microsoft의 객체지향 언어, Windows 앱',
      'Rust': '메모리 안전 시스템 프로그래밍 언어',
      'TypeScript': 'JavaScript에 정적 타입을 추가한 언어',
    };
    const techDesc = {
      'Jetpack Compose': 'Android 선언형 UI 프레임워크',
      'PaddleOCR': '텍스트 인식(OCR) 라이브러리',
      'Gemma 4 E4B': 'Google 온디바이스 LLM',
      'Qwen3-4B': 'Alibaba 소형 LLM',
      'Tkinter': 'Python 표준 GUI 라이브러리',
      'PySide6': 'Qt 기반 Python GUI 프레임워크',
      'ComfyUI': '노드 기반 AI 이미지 생성',
      'LM Studio': '로컬 LLM 실행 도구',
      'WebAssembly': '브라우저에서 네이티브 속도 실행',
      'Room': 'Android SQLite ORM',
      'FFmpeg': '오디오/비디오 처리 도구',
      'faster-whisper': '음성 인식(STT) 라이브러리',
      'PWA': 'Progressive Web App',
      'VS Code API': 'VS Code 확장 API',
      'SQLite': '경량 파일 기반 DB',
      'AI API': 'AI 서비스 API 연동',
      'LLM API': '대규모 언어 모델 API',
      'Gemini API': 'Google Gemini API',
      '.NET 10': 'Microsoft .NET 10 런타임',
      'chardet': '문자 인코딩 감지 라이브러리',
      'JSON': '데이터 교환 포맷',
      'Node.js': 'JavaScript 서버 런타임',
      'OpenCV': '컴퓨터 비전 라이브러리',
    };

    function renderTabs(categories) {
      tabs.innerHTML = '';
      const select = document.getElementById('category-select');
      if (select) select.innerHTML = '';
      categories.forEach((c) => {
        const btn = document.createElement('button');
        btn.className = 'px-2 py-0.5 rounded text-xs transition border ' +
          (c.id === currentCategory ? 'bg-green-500/20 text-green-300 border-green-500/40' : 'bg-white/5 text-zinc-400 border-white/10 hover:bg-white/10');
        btn.textContent = c.label;
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', c.id === currentCategory);
        btn.addEventListener('click', () => { currentCategory = c.id; renderTabs(categories); renderGrid(); if (select) select.value = currentCategory; });
        tabs.appendChild(btn);
        if (select) {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.label;
          if (c.id === currentCategory) opt.selected = true;
          select.appendChild(opt);
        }
      });
      if (select && !select._bound) {
        select._bound = true;
        select.addEventListener('change', () => { currentCategory = select.value; renderTabs(categories); renderGrid(); });
      }
    }

    function renderGrid() {
      grid.innerHTML = '';
      const filtered = currentCategory === 'all' ? allProjects : allProjects.filter(p => p.category === currentCategory);
      if (filtered.length === 0) { empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      filtered.forEach((p, i) => {
        const card = document.createElement('article');
        card.className = 'project-card group rounded-lg bg-zinc-900/60 border border-white/5 overflow-hidden';
        const badgeClass = langColor[p.language] || 'text-zinc-300';
        const demoLink = p.demo ? `<a href="${p.demo}" target="_blank" rel="noopener" class="text-xs text-blue-400 hover:underline">demo →</a>` : '';
        const forkLabel = p.forked ? `<span class="text-xs text-zinc-600">forked${p.original ? ' from ' + p.original : ''}</span>` : '';
        card.innerHTML = `
          <div class="flex items-center gap-1.5 px-2 py-1.5 bg-zinc-800/60 border-b border-white/5">
            <iconify-icon icon="solar:terminal-bold" class="text-sm text-green-400"></iconify-icon>
            <span class="ml-1 text-sm text-zinc-200 font-mono truncate flex-1"><a href="${p.github}" target="_blank" rel="noopener" class="hover:text-blue-300 transition">${p.name}</a></span>
            <a href="${p.github}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-white/5 hover:bg-white/10 text-zinc-300 hover:text-white transition text-xs" aria-label="${p.name} GitHub 저장소로 이동" title="GitHub 저장소 열기">
              <iconify-icon icon="solar:arrow-right-up-bold" class="text-sm"></iconify-icon>
              <span>open</span>
            </a>
          </div>
          <div class="screenshot bg-zinc-800 overflow-hidden hidden sm:group-hover:block" style="aspect-ratio:16/10">
            <img src="${p.screenshot}" alt="${p.name} 스크린샷" loading="lazy" decoding="async" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=&quot;flex items-center justify-center h-full text-zinc-600&quot;><iconify-icon icon=&quot;solar:code-square-bold&quot; class=&quot;text-2xl&quot;></iconify-icon></div>';">
          </div>
          <div class="p-3">
            <div class="flex items-center justify-between gap-2 mb-1">
              <span class="lang-badge ${badgeClass}" title="${langDesc[p.language] || p.language}">${p.language}</span>
            </div>
            <p class="text-xs text-zinc-400 leading-relaxed keep-all mb-2">${p.description}</p>
            <div class="text-[0.6rem] text-zinc-600 font-mono mb-2">created ${p.created_at || '-'} · updated ${p.updated_at || '-'}</div>
            <div class="flex flex-wrap gap-1 mb-2">
              ${p.tech.map(t => `<span class="text-[0.65rem] px-1.5 py-0.5 rounded bg-white/5 text-zinc-400" title="${techDesc[t] || t}">${t}</span>`).join('')}
            </div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                ${demoLink}
              </div>
              ${forkLabel}
            </div>
          </div>
        `;
        // 카드 클릭 시 모달 열기 (링크 클릭은 제외)
        card.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          openModal(p);
        });
        card.style.cursor = 'pointer';
        grid.appendChild(card);
      });
    }

    // ---------- IntersectionObserver ----------
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

    // ---------- About 스트리밍 ----------
    (function () {
      const body = document.getElementById('about-body');
      if (!body) return;
      const out = '◆ Android 앱, Python 데스크톱 도구, 웹 게임, Windows 유틸리티까지\n→ 다양한 플랫폼에서 직접 만들어보며 배우고 있습니다.\n✓ AI·OCR·음성인식·LLM 등 최신 기술을 활용한 실용적인 프로그램을 만드는 것을 좋아합니다.\n$ cat skills.txt\n◆ Kotlin · Jetpack Compose · Python · Tkinter · PySide6\n◆ JavaScript · TypeScript · C#/.NET 10 · Rust · WebAssembly';
      let started = false;
      const obs = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting && !started) {
            started = true;
            obs.unobserve(entry.target);
            let currentLine = document.createElement('div');
            body.appendChild(currentLine);
            let cursor = document.createElement('span');
            cursor.className = 'cursor-blink text-green-400';
            cursor.textContent = '█';
            currentLine.appendChild(cursor);
            let oi = 0;
            function streamChar() {
              if (oi < out.length) {
                if (out[oi] === '\n') {
                  // 이전 라인의 커서 제거
                  if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
                  currentLine = document.createElement('div');
                  body.appendChild(currentLine);
                  cursor = document.createElement('span');
                  cursor.className = 'cursor-blink text-green-400';
                  cursor.textContent = '█';
                  currentLine.appendChild(cursor);
                } else {
                  // 커서 앞에 텍스트 삽입
                  currentLine.insertBefore(document.createTextNode(out[oi]), cursor);
                }
                oi++;
                setTimeout(streamChar, 18 + Math.random() * 18);
              }
            }
            setTimeout(streamChar, 300);
          }
        });
      }, { threshold: 0.3 });
      obs.observe(body);
    })();

    // ---------- 프로젝트 모달 (모바일 확대) ----------
    const modal = document.getElementById('project-modal');
    const modalContent = document.getElementById('modal-content');
    const modalClose = document.getElementById('modal-close');
    function openModal(p) {
      const badgeClass = langColor[p.language] || 'text-zinc-300';
      const demoLink = p.demo ? `<a href="${p.demo}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-xs text-blue-400 hover:underline">demo →</a>` : '';
      modalContent.innerHTML = `
        <div class="screenshot bg-zinc-800 overflow-hidden" style="aspect-ratio:16/10">
          <img src="${p.screenshot}" alt="${p.name} 스크린샷" loading="lazy" decoding="async" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=&quot;flex items-center justify-center h-full text-zinc-600&quot;><iconify-icon icon=&quot;solar:code-square-bold&quot; class=&quot;text-4xl&quot;></iconify-icon></div>';">
        </div>
        <div class="p-5">
          <div class="flex items-center justify-between gap-2 mb-2">
            <h3 id="modal-title" class="font-bold text-lg keep-all text-zinc-100">${p.name}</h3>
            <span class="lang-badge ${badgeClass}">${p.language}</span>
          </div>
          <p class="text-sm text-zinc-300 leading-relaxed keep-all mb-3">${p.description}</p>
          <div class="text-xs text-zinc-500 font-mono mb-3">created ${p.created_at || '-'} · updated ${p.updated_at || '-'}</div>
          <div class="flex flex-wrap gap-1.5 mb-3">
            ${p.tech.map(t => `<span class="text-xs px-2 py-0.5 rounded bg-white/5 text-zinc-400" title="${techDesc[t] || t}">${t}</span>`).join('')}
          </div>
          <div class="flex items-center gap-3">
            <a href="${p.github}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded bg-white/5 hover:bg-white/10 text-zinc-200 text-xs transition">
              <iconify-icon icon="solar:github-bold"></iconify-icon> GitHub
            </a>
            ${demoLink}
            ${p.forked ? `<span class="text-xs text-zinc-500">forked${p.original ? ' from ' + p.original : ''}</span>` : ''}
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    }
    if (modalClose) modalClose.addEventListener('click', closeModal);
    if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // ---------- 데이터 로드 ----------
    fetch('projects.json')
      .then(r => r.json())
      .then(data => {
        allProjects = data.projects;
        renderTabs(data.categories);
        renderGrid();
      })
      .catch(err => {
        console.error('projects.json 로드 실패:', err);
        grid.innerHTML = '<p class="text-zinc-400 col-span-full text-center text-xs">프로젝트 데이터를 불러올 수 없습니다. 로컬 서버로 실행해 주세요.</p>';
      });

    // ---------- 터미널 스트리밍 ----------
    (function () {
      const body = document.getElementById('terminal-body');
      if (!body) return;
      const commands = [
        { cmd: '', out: '◆ Initializing profile...\n▸ 안녕하세요, Donian 입니다.\n◆ 시골아재, 파이썬과 코틀린으로 프로그래밍을 공부하고 있습니다.\n→ 문제를 직접 만들고 해결하는 과정을 즐기며,\n✓ 오픈소스 프로젝트를 공개하고 있습니다.\n⚡ Done.' },
        { cmd: 'ai --about', out: '◆ Android 앱, Python 데스크톱 도구, 웹 게임, Windows 유틸리티까지\n→ 다양한 플랫폼에서 직접 만들어보며 배우고 있습니다.\n✓ AI·OCR·음성인식·LLM 등 최신 기술을 활용한 실용적인 프로그램을 만드는 것을 좋아합니다.\n⚡ Done.' },
      ];
      let ci = 0;
      function runCommand() {
        if (ci >= commands.length) {
          ci = 0;
          setTimeout(() => { body.innerHTML = ''; setTimeout(runCommand, 600); }, 2200);
          return;
        }
        const { cmd, out } = commands[ci];
        let typingText = null;
        let cursor = null;
        if (cmd) {
          const line = document.createElement('div');
          line.innerHTML = '<span class="text-green-400 font-bold">$</span> <span class="text-zinc-200 ml-2 typing-text"></span><span class="cursor-blink text-green-400">█</span>';
          body.appendChild(line);
          typingText = line.querySelector('.typing-text');
          cursor = line.querySelector('span:last-child');
        }
        let i = 0;
        function typeChar() {
          if (cmd && i < cmd.length) {
            typingText.textContent += cmd[i++];
            body.scrollTop = body.scrollHeight;
            setTimeout(typeChar, 40 + Math.random() * 30);
          } else {
            if (cursor) cursor.remove();
            setTimeout(() => {
              let currentLine = document.createElement('div');
              currentLine.className = 'text-zinc-400 pl-4';
              body.appendChild(currentLine);
              let oi = 0;
              function streamChar() {
                if (oi < out.length) {
                  if (out[oi] === '\n') {
                    currentLine = document.createElement('div');
                    currentLine.className = 'text-zinc-400 pl-4';
                    body.appendChild(currentLine);
                  } else {
                    currentLine.textContent += out[oi];
                  }
                  oi++;
                  body.scrollTop = body.scrollHeight;
                  setTimeout(streamChar, 20 + Math.random() * 20);
                } else {
                  ci++;
                  const cursorLine = document.createElement('div');
                  cursorLine.innerHTML = '<span class="text-green-400 font-bold">$</span> <span class="cursor-blink text-green-400 ml-2">█</span>';
                  body.appendChild(cursorLine);
                  body.scrollTop = body.scrollHeight;
                }
              }
              streamChar();
            }, 300);
          }
        }
        setTimeout(typeChar, 200);
      }
      body.innerHTML = '';
      setTimeout(runCommand, 500);
    })();
  </script>
</body>
</html>
